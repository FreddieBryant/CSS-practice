<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Fields</title>
    <link rel="stylesheet" href="/CSS-Basics/css/normalize.css" />
    <link rel="stylesheet" href="data-fields.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.css"
    />
  </head>
  <body>
    <form>
      <input type="text" list="countries" autocomplete="off" />
      <datalist id="countries">
        <option data-value="1">Australia</option>
        <option>Canada</option>
        <option>India</option>
        <option>United States</option>
      </datalist>
      <select>
        <optgroup label="Front-end Courses">
          <option value="html" selected>HTML</option>
          <option value="css">CSS</option>
          <option value="javascript">JavaScript</option>
        </optgroup>
        <optgroup label="Back-end Courses">
          <option value="node">Node.js</option>
          <option value="express">Express</option>
          <option value="mongodb">MongoDB</option>
        </optgroup>
      </select>
      <input type="file" multiple accept=".jpg, .png" />
    </form>
  </body>
</html>
