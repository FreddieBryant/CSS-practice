<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check boxes and radio buttons</title>
    <link rel="stylesheet" href="/CSS-Basics/css/normalize.css" />
    <link rel="stylesheet" href="radio_checkbox.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.css"
    />
  </head>
  <body>
    <div>
      <input type="checkbox" id="front-end" />
      <label class="label-inline" for="front-end">Front-end</label>
    </div>
    <div>
      <input type="checkbox" id="Back-end" checked />
      <label class="label-inline" for="Back-end">Back-end</label>
    </div>
    <div>
      <input type="radio" name="membership" id="silver" checked />
      <label for="silver" class="label-inline">Silver</label>
    </div>
    <div>
      <input type="radio" name="membership" id="gold" />
      <label for="gold" class="label-inline">Gold</label>
    </div>
    <input type="range" min="0" max="100" />
  </body>
</html>
