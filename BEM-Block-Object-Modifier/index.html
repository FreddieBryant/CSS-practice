<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEM Bock Object Modifier</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="card">
      <header class="card__header">
        <span class="card__price"></span>
      </header>
      <div class="card__body">
        <button class="btn"></button>
        <!-- button class stays btn because it can be reused outside of this block -->
      </div>
      <!-- Using thge BEM convention in the class name you seperate using two underscores(__) -->
      <!-- first you add the name of the block(card) then seperate by two underscores(__) then add the name of the element(header) -->
      <!-- all the other naming conventions are listed -->
    </div>
    <div class="card card--popular">
      <!-- use double hyphens (--)to separate blocks from modifiers(card--popular) -->
      <header class="card__header">
        <span class="card__price"></span>
      </header>
      <div class="card__body">
        <button class="btn"></button>
        <!-- button class stays btn because it can be reused outside of this block -->
      </div>
      <!-- Using thge BEM convention in the class name you seperate using two underscores(__) -->
      <!-- first you add the name of the block(card) then seperate by two underscores(__) then add the name of the element(header) -->
      <!-- all the other naming conventions are listed -->
    </div>
  </body>
</html>
